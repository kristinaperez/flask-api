name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            cd ~/flask-api

            echo "📦 Save current version"
            PREV=$(git rev-parse HEAD)

            git pull

            echo "🔨 Build"
            docker-compose build

            echo "🚀 Start"
            docker-compose up -d

            echo "🧪 Healthcheck"

            SUCCESS=0
 
            for i in {1...10}; do
              if curl -fk https://localhost/health; then
                echo "✅ App is ready" 
                SUCCESS=1
                break
              fi  
              echo "⏳  Waiting..."
              sleep 3 
            done
 
            if [ $SUCCESS -ne 1]; then
              echo "❌ Deploy failed, rollback..."
          
              git checkout $PREV 
              docker-compose up -d --build

              exit 1
            fi             

            echo "✅ Deploysuccess"
          EOF
