worker_processes auto;

events {
  worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream app {
        least_conn;
    
        server app:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        #базовые таймауты (очень важно для прода)
        proxy_connect_timeout 3s; 
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        #чтобы не держать зависшие соединения
        send_timeout 10s; 
        
        location / {
            proxy_pass http://app;

            #обязательно для нормальной работы бэкенд 
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
            proxy_set_header X-Forwarded-Proto $scheme;

            # retry логика
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
        
        #healthcheck (не обязательно наружу, но удобно)
        location /health {
           access_log off;
           proxy_Path http://app/health;
        }

        location /ready {
           access_log off;
           proxy_Path http://app/ready;
        }
    }
}
