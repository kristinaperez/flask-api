worker_processes auto;

events {
  worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream app {
        least_conn;
        server app:5000 max_fails=3 fail_timeout=5s;
    }

    # HTTP → HTTPS
    server {
        listen 80;
        server_name 34-175-212-246.nip.io;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name 34-175-212-246.nip.io;

        ssl_certificate     /etc/letsencrypt/live/34-175-212-246.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/34-175-212-246.nip.io/privkey.pem;

        # таймауты
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        send_timeout 10s;

        location / {
            proxy_pass http://app;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 5;
            proxy_next_upstream_timeout 5s;
        }

        location /health {
           access_log off;
           proxy_pass http://app/health;
        }

        location /ready {
           access_log off;
           proxy_pass http://app/ready;
        }
    }
}
